<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Tab Grouper</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="" width="20" height="20">
      <h1>AI Tab Grouper</h1>
    </div>
    <p id="summary" class="summary" aria-live="polite">Reading tabs…</p>
    <button id="undo" type="button" class="btn btn-sm" hidden title="Ungroup the tabs from the last run (Ctrl+Z)">Undo</button>
    <button id="settings" type="button" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <section id="setup" class="notice" hidden>
    <p>Add your Claude API key to start grouping tabs.</p>
    <button id="open-settings" type="button" class="btn btn-primary btn-sm">Open settings</button>
  </section>

  <section class="actions">
    <button id="group" type="button" class="btn btn-primary btn-lg" disabled>
      <span class="spinner" aria-hidden="true"></span>
      <span id="group-label">Group tabs</span>
    </button>
    <p id="status" class="status" role="status"></p>
  </section>

  <main id="list" aria-label="Tab groups in this window"></main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" class="btn-link">Undo</button>
  </div>

  <template id="group-tpl">
    <details class="group">
      <summary class="group-head">
        <span class="dot"></span>
        <span class="group-title"></span>
        <span class="tag" hidden>new</span>
        <span class="badge"></span>
      </summary>
      <ul class="rows"></ul>
    </details>
  </template>

  <template id="row-tpl">
    <li class="row">
      <img class="favicon" alt="" width="16" height="16">
      <button type="button" class="title btn-link" title="Switch to this tab"></button>
    </li>
  </template>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
